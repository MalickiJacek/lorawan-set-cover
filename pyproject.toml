[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorawan-setcover"
version = "3.1.0"
description = "Optimal LoRaWAN gateway placement: Set Cover / Maximum Coverage ILP on GIS data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacek Malicki" }]
requires-python = ">=3.10"
dependencies = [
  "pulp>=2.7,<4",
  "pandas>=1.5",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyogrio>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
lorawan-setcover = "lorawan_setcover.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:PULP_CBC_CMD is deprecated:DeprecationWarning"]
